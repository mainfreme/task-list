networks:
    network:
        driver: bridge
    proxy-network:
        external: true # Ta sieć jest tworzona i zarządzana przez inny projekt (nginx-proxy)

volumes:
    db_data:
    redis_data:

services:
    app:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
        container_name: app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./task:/var/www
        environment:
            - APP_ENV=dev
            - DATABASE_URL=pgsql://user:passwd@db:5432/db
            # Redis (kontener `redis`) — nadpisuje .env; obraz PHP używa Predis (brak ext-redis)
            - REDIS_HOST=redis
            - REDIS_PORT=6379
            - REDIS_CLIENT=predis
        depends_on:
            db:
                condition: service_started
            redis:
                condition: service_healthy
        networks:
            - network
            - proxy-network   # dodajemy sieć proxy

    nginx:
        image: nginx:latest
        restart: unless-stopped
        volumes:
            - ./task:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - network
            - proxy-network   # dodajemy sieć proxy

    db:
        image: postgres:latest
        container_name: db
        restart: unless-stopped
        environment:
            POSTGRES_DB: db
            POSTGRES_USER: user
            POSTGRES_PASSWORD: passwd
        ports:
            # Host 5432 często zajęty (lokalny PostgreSQL / MAMP) — z hosta: localhost:5433
            - "5433:5432"
        volumes:
            - db_data:/var/lib/postgresql
        networks:
            - network

    redis:
        image: redis:7-alpine
        container_name: redis
        restart: unless-stopped
        command: redis-server --appendonly yes
        ports:
            - "6380:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        networks:
            - network

    rabbitmq:
        image: rabbitmq:3-management-alpine
        container_name: rabbitmq
        restart: unless-stopped
        ports:
            - "5673:5672"
            - "15673:15672"
        environment:
            RABBITMQ_DEFAULT_USER: guest
            RABBITMQ_DEFAULT_PASS: guest
        networks:
            - network

