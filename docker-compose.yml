networks:
    network:
        driver: bridge

services:
    app:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
        container_name: app
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./task:/var/www
        environment:
            - APP_ENV=dev
            - DATABASE_URL=pgsql://user:passwd@db:5432/db
        depends_on:
            - db
        networks:
            - network

    nginx:
        image: nginx:latest
        container_name: nginx
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ./task:/var/www
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - network

    db:
        image: postgres:latest
        container_name: db
        restart: unless-stopped
        environment:
            POSTGRES_DB: db
            POSTGRES_USER: user
            POSTGRES_PASSWORD: passwd
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql
        networks:
            - network

volumes:
    db_data:
