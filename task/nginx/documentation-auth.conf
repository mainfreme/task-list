# Zabezpieczenie dokumentacji API (Swagger) - HTTP Basic Auth
# Dołącz ten plik w bloku server {} PRZED ogólną lokalizacją location /
#
# Użycie:
#   include /ścieżka/do/projektu/nginx/documentation-auth.conf;
#
# Wymagane: utwórz plik .htpasswd (patrz nginx/README.md)

location ~ ^/(api/documentation|api/document|docs)(/|$) {
    auth_basic "API Documentation";
    auth_basic_user_file "/var/www/nginx/.htpasswd /Applications/MAMP/htdocs/app/task list/backend/task/nginx/.htpasswd";

    try_files $uri $uri/ /index.php?$query_string;
}
