openapi: 3.0.0
info:
  title: 'Task List API'
  description: 'API documentation for the Task List application'
  contact:
    email: support@example.com
  version: 1.0.0
servers:
  -
    url: /api
    description: 'Main API Server'
paths:
  /v1/crm:
    get:
      tags:
        - CRM
      summary: 'List all CRM clients'
      operationId: ee804988941537a3636247a5b606fd3d
      responses:
        200:
          description: 'Successful operation'
        401:
          description: Unauthenticated
      security:
        -
          jwt: []
    post:
      tags:
        - CRM
      summary: 'Create a new CRM client'
      operationId: 1fd3b6db94d49ceb50b463abee561deb
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - name
                - email
              properties:
                name:
                  type: string
                  example: 'John Doe'
                email:
                  type: string
                  format: email
                  example: john@example.com
              type: object
      responses:
        201:
          description: 'Client created successfully'
        400:
          description: 'Bad Request'
        401:
          description: Unauthenticated
      security:
        -
          jwt: []
  '/v1/crm/{id}':
    get:
      tags:
        - CRM
      summary: 'Get CRM client by ID'
      operationId: 17f548db117b7d4440130c696edc9a2d
      parameters:
        -
          name: id
          in: path
          description: 'Client ID'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        200:
          description: 'Client retrieved successfully'
        404:
          description: 'Client not found'
      security:
        -
          jwt: []
    put:
      tags:
        - CRM
      summary: 'Update an existing CRM client'
      operationId: 3a41e4709c78c9bbf522f3b82945bc19
      parameters:
        -
          name: id
          in: path
          description: 'Client ID'
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                name:
                  type: string
                  example: 'John Doe'
                email:
                  type: string
                  format: email
                  example: john@example.com
              type: object
      responses:
        200:
          description: 'Client updated successfully'
        404:
          description: 'Client not found'
      security:
        -
          jwt: []
    delete:
      tags:
        - CRM
      summary: 'Delete a CRM client'
      operationId: ddb6c49c9fc772e2e34b41041a50a94e
      parameters:
        -
          name: id
          in: path
          description: 'Client ID'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        204:
          description: 'Client deleted successfully'
        404:
          description: 'Client not found'
      security:
        -
          jwt: []
components:
  securitySchemes:
    jwt:
      type: http
      bearerFormat: JWT
      scheme: bearer
tags:
  -
    name: CRM
    description: CRM
