name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, mbstring, openssl, pdo, sodium
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Run PHP CS Fixer (check)
        run: composer cs-fix-check

      - name: Run PHPStan
        run: composer phpstan

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get changed PHP files
        id: files
        run: |
          git fetch origin ${{ github.base_ref }}

          git diff --name-only origin/${{ github.base_ref }} \
          | grep "\.php$" > changed_files.txt || true

          if [ -s changed_files.txt ]; then
            echo "has_php_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_php_changes=false" >> $GITHUB_OUTPUT
          fi

          echo "Changed PHP files:"
          cat changed_files.txt || true

      - name: Build diff
        if: steps.files.outputs.has_php_changes == 'true'
        run: |
          git diff origin/${{ github.base_ref }} -- $(cat changed_files.txt) > diff.txt
          echo "Diff size:"
          wc -l diff.txt

      - name: Prepare prompt
        if: steps.files.outputs.has_php_changes == 'true'
        run: |
          echo "You are a senior PHP Laravel developer doing code review." > prompt.txt
          echo "" >> prompt.txt
          echo "Focus on:" >> prompt.txt
          echo "- Clean code" >> prompt.txt
          echo "- Laravel best practices" >> prompt.txt
          echo "- Security vulnerabilities" >> prompt.txt
          echo "- Eloquent / database performance issues" >> prompt.txt
          echo "- DDD / CQRS architecture violations" >> prompt.txt
          echo "" >> prompt.txt
          echo "Review this code diff:" >> prompt.txt
          cat diff.txt >> prompt.txt

      - name: Run AI review
        if: steps.files.outputs.has_php_changes == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |

          RESPONSE=$(curl https://api.openai.com/v1/chat/completions \
          -s \
          -H "Authorization: Bearer $OPENAI_API_KEY" \
          -H "Content-Type: application/json" \
          -d @- <<EOF
          {
            "model": "gpt-4.1",
            "messages": [
              {
                "role": "system",
                "content": "You are a strict senior code reviewer."
              },
              {
                "role": "user",
                "content": "$(cat prompt.txt | sed 's/"/\\"/g')"
              }
            ]
          }
          EOF
          )

          echo "$RESPONSE" | jq -r '.choices[0].message.content' > review.md

          echo "AI Review:"
          cat review.md

      - name: Post PR review
        if: steps.files.outputs.has_php_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |

          gh api \
          repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews \
          -f body="$(cat review.md)" \
          -f event="COMMENT"